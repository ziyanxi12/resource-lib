server {
    listen 80;
    server_name resource-lib.local;

    # 不带尾部斜杠 → 重定向到带斜杠
    location = /assets/resource-ui {
        return 301 /assets/resource-ui/;
    }

    # 前端静态文件 — 路径带 /assets/resource-ui/
    location /assets/resource-ui/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /assets/resource-ui/index.html;
    }

    # 后端反向代理（/aaa/ 前缀剥离）
    location /aaa/ {
        proxy_pass http://host.docker.internal:8009/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
